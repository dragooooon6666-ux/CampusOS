<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CampusOS — 校园事务智能操作系统</title>
<link rel="stylesheet" href="/css/tokens.css">
<link rel="stylesheet" href="/css/base.css">
<style>
  .sidebar-nav { padding: var(--space-md); }
  .sidebar-nav .nav-section { margin-bottom: var(--space-lg); }
  .sidebar-nav .nav-label { font-size: 0.6875rem; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; padding: var(--space-xs) var(--space-sm); margin-bottom: var(--space-xs); }
  .sidebar-nav a { display: block; padding: var(--space-sm) var(--space-md); border-radius: var(--radius-md); font-size: 0.875rem; color: var(--ink); text-decoration: none; transition: background var(--duration-fast) var(--ease-out); }
  .sidebar-nav a:hover { background: oklch(0.55 0.18 255 / 0.08); text-decoration: none; }
  .sidebar-nav a.active { background: oklch(0.55 0.18 255 / 0.12); color: var(--primary); font-weight: 500; }
  .sidebar-brand { padding: var(--space-md); font-weight: 700; font-size: 1.0625rem; letter-spacing: -0.01em; display: flex; align-items: center; gap: 8px; border-bottom: 1px solid var(--border); margin-bottom: var(--space-sm); }
</style>
</head>
<body>
<div class="app-shell">
  <aside class="sidebar">
    <a href="#/" class="sidebar-brand">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
        <rect x="3" y="7" width="18" height="13" rx="2.5" fill="var(--primary)"/>
        <path d="M7 4h4a1 1 0 011 1v3H6V5a1 1 0 011-1z" fill="oklch(0.62 0.14 255)"/>
        <circle cx="12" cy="13.5" r="1.2" fill="#fff"/>
      </svg>
      CampusOS
    </a>
    <nav class="sidebar-nav">
      <div class="nav-section">
        <div class="nav-label">主菜单</div>
        <a href="#/projects">📋 项目看板</a>
        <a href="#/files">📁 文件中心</a>
        <a href="#/writing">✏️ 写作中心</a>
      </div>
      <div class="nav-section">
        <div class="nav-label">系统</div>
        <a href="#/settings">⚙️ 设置</a>
      </div>
    </nav>
  </aside>
  <main class="main-content" id="view"></main>
</div>
<script type="module" src="/js/app.js"></script>
</body>
</html>
